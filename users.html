<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HomeBase — User Database</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 40px; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  .sub { color: #94a3b8; margin-bottom: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; max-width: 900px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid #334155; }
  th { background: #0f172a; color: #38bdf8; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
  tr:last-child td { border-bottom: none; }
  .count { display: inline-block; background: #10b981; color: #0f172a; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 13px; }
</style>
</head>
<body>
  <h1>HomeBase User Database</h1>
  <div class="sub">Registered users <span class="count" id="count">0</span></div>
  <div class="card">
    <table>
      <thead>
        <tr><th>ID</th><th>Name</th><th>Email</th><th>Joined</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
<script>
fetch('users.json')
  .then(r => r.json())
  .then(users => {
    document.getElementById('count').textContent = users.length;
    document.getElementById('rows').innerHTML = users.map(u =>
      `<tr><td>${u.id}</td><td>${u.name}</td><td>${u.email}</td><td>${u.joined}</td></tr>`
    ).join('');
  });
</script>
</body>
</html>
